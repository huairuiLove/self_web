[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "function-search"
version = "1.0.0"
description = "Fast fuzzy search for PyTorch, Python, and backend development APIs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Function Search" }]
dependencies = [
    "rapidfuzz>=3.6.0",
    "customtkinter>=5.2.0",
]

[project.optional-dependencies]
build = [
    "torch>=2.0.0",
    "pyinstaller>=6.0.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
function-search = "function_search.main:main"
build-index = "function_search.build_index:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
function_search = ["data/*.db", "data/*.json"]
